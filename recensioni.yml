name: Aggiorna recensioni Google

on:
  schedule:
    - cron: "0 5 * * *"   # ogni giorno alle 6 (ora italiana, inverno)
  workflow_dispatch:       # avvio manuale da Actions > Run workflow

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica recensioni
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: python3 scripts/aggiorna_recensioni.py
      - name: Salva se cambiate
        run: |
          if ! git diff --quiet reviews.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add reviews.json
            git commit -m "Aggiorna recensioni Google"
            git push
          fi
